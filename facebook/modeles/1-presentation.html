<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css"><style>
.bar{position:absolute;left:0;top:250px;height:200px;width:100%;background:#f5b400;transform-origin:left;transform:scaleX(0);animation:wipe .5s cubic-bezier(.8,0,.2,1) .1s both, wipeOut .5s cubic-bezier(.8,0,.2,1) .9s forwards}
@keyframes wipe{to{transform:scaleX(1)}} @keyframes wipeOut{from{transform:scaleX(1);transform-origin:right}to{transform:scaleX(0);transform-origin:right}}
.big{position:absolute;top:200px;width:100%;text-align:center;font-family:'Inter Display',Inter;font-weight:900;font-size:220px;letter-spacing:-6px}
.big i{font-style:normal;display:inline-block;animation:drop .6s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes drop{from{opacity:0;transform:translateY(-200px)}to{opacity:1;transform:none}}
.sub{position:absolute;top:470px;width:100%;text-align:center;font-size:40px;font-weight:600;color:#c9d6e3;animation:fadeUp .6s 1.5s both}
.grid{position:absolute;top:580px;left:70px;right:70px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.card{background:#16263b;border:2px solid #2b4562;border-radius:20px;padding:26px 28px;display:flex;align-items:center;gap:22px;font-size:30px;font-weight:700;animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}
.ic{flex:none;width:64px;height:64px;border-radius:16px;background:#f5b400;display:flex;align-items:center;justify-content:center}
</style></head><body>
